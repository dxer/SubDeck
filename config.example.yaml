# SubDeck 配置文件示例
# 复制为 config.yaml 或通过 `subdeck -config /path/to/config.yaml` 加载
# 优先级：命令行参数 > 环境变量 (SUBDECK_*) > 本配置文件 > 默认值

server:
  host: "0.0.0.0"
  port: 8080
  # 反代可信 IP/CIDR 列表（如 Nginx/Caddy 本机反代可填 ["127.0.0.1"]）
  trusted_proxies: []
  cors_origin: "*"

database:
  path: "data/subs.db"

auth:
  # 管理员用户名
  admin_username: "admin"
  # 管理员密码（留空则在首次初始化数据库时使用默认密码 admin123；设置后修改此处并重启可同步更新密码）
  admin_password: ""
  # JWT 签名密钥（留空则首次启动自动生成随机密钥并持久化到数据库）
  jwt_secret: ""
