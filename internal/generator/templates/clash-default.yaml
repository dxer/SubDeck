# SubDeck built-in default Clash (mihomo) base template.
# Static foundation only — proxies / proxy-groups / rules are generated per
# profile (rule preset, region groups) and injected via template merge.
# User-configured templates overlay on top of this base.

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
external-controller: 127.0.0.1:9090

# Remember manual group selections and fake-ip mappings across restarts.
profile:
  store-selected: true
  store-fake-ip: true

# Traffic sniffing so domain rules (GEOSITE/DOMAIN-SUFFIX) also match
# connections made by raw IP.
sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
  skip-domain:
    - "Mijia Cloud"

# TUN stack preconfigured but disabled: flip `enable` to true (or via a user
# template override) for system-wide transparent proxying.
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "lens.l.google.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
